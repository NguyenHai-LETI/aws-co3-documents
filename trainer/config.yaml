# Cấu hình trainer (đọc lại mỗi request — không cần khởi động lại app)

coach:
  model: ""                 # model mặc định cho mọi tác vụ; trống = mặc định của Claude Code (vd: sonnet | opus)
  models:                   # ghi đè theo tác vụ (trống = dùng `model`)
    analyze: ""             # phân tích + kế hoạch (cần suy luận tốt)
    generate: "sonnet"      # sinh câu hỏi từ tài liệu
    enrich: "sonnet"        # bảo trì ngân hàng: giải thích, gợi ý, phân loại, cân độ dài, câu dài
    ask: "sonnet"           # "Hỏi AI về câu này"
    verify: "opus"          # model thứ hai "giải mù" câu mới / câu vừa sửa (nên khác model sinh câu)
  effort: ""                # trống = mặc định; low | medium | high | xhigh | max
  max_budget_usd: 0         # chỉ áp dụng khi Claude Code dùng API key; 0 = không giới hạn
  skip_if_no_new_results: true   # lượt chạy theo lịch bỏ qua phân tích nếu không có bài làm/issue mới
  enrich_on_idle: true      # ...và khi đó chạy 1 lượt bảo trì ngân hàng (ENRICH) thay thế
  enrich_batch_size: 20     # số câu mỗi lượt ENRICH
  max_runs_per_day: 6       # giới hạn an toàn cho lượt chạy theo lịch
  schedule: ["08:30", "12:30", "21:00"]   # giờ chạy tự động (npm run schedule -- install)
  hosts: []                 # tên máy được phép chạy coach theo lịch (vd ["ntqs-Mac-mini"]); [] = mọi máy
  claude_bin: ""            # đường dẫn Claude Code CLI nếu app không tự tìm thấy
  use_api_key: false        # false = luôn dùng đăng nhập claude.ai (bỏ ANTHROPIC_API_KEY khỏi môi trường của coach)
  structured_output: true   # sinh câu / ENRICH / câu dài trả JSON (--json-schema), app tự kiểm tra rồi ghi file — AI không cần quyền ghi
  enrich_after_analyze: false   # sau mỗi lượt phân tích, ENRICH thêm ~10 câu bạn sắp gặp (tốn thêm quota)
  verify:
    auto: true              # sau lượt AI: model thứ hai giải mù câu mới / câu vừa sửa (không xem đáp án)
    auto_draft: true        # giải mù không khớp / mơ hồ → câu do AI viết chuyển sang draft, chờ bạn duyệt (Ngân hàng → Chất lượng)
    batch_size: 10          # số câu mỗi lần gọi model kiểm tra

srs:
  algorithm: fsrs           # fsrs (khuyến nghị) | leitner
  desired_retention: 0.9    # FSRS: xác suất nhớ mục tiêu khi đến hạn ôn
  daily_limit: 50           # tối đa số câu ôn mỗi ngày (phần dư chuyển sang hôm sau)
  mastered_stability_days: 21   # FSRS: độ bền trí nhớ ≥ N ngày = "đã thuộc"
  intervals_days: [1, 3, 7, 14, 30]   # chỉ dùng khi algorithm = leitner
  mastered_box: 4                     # chỉ dùng khi algorithm = leitner
  weights: []               # FSRS-6: bộ tham số tự đặt; [] = dùng tham số cá nhân (nếu đã tối ưu) hoặc mặc định
  optimize: auto            # auto | manual | off — tối ưu tham số FSRS theo lịch sử làm bài của bạn
  optimize_min_reviews: 400 # cần tối thiểu N lượt ôn trước khi tối ưu

practice:
  default_count: 20
  quick_count: 10
  shuffle_options: true     # xáo thứ tự đáp án mặc định (chống nhớ vị trí)
  exclude_out_of_scope: true   # bỏ câu có đáp án là dịch vụ ngoài phạm vi đề (CodeCommit, IoT…) khỏi các chế độ luyện

exam:
  sealed_forms: 2           # số đề niêm phong: câu được giữ lại, không xuất hiện khi luyện, để đo điểm trên câu mới
  sealed_size: 50           # số câu tính điểm mỗi đề niêm phong (+15 câu thử nghiệm lấy từ ngân hàng thường)

stats:
  rushed_median_seconds: 5      # bài có thời gian trung vị/câu dưới ngưỡng = "làm vội", không tính vào thống kê
  recency_half_life_days: 14    # mức sẵn sàng: kết quả cũ hơn N ngày có trọng số giảm một nửa
  recognized_wpm: 300           # gặp lại mà đúng nhanh hơn tốc độ đọc này (từ/phút) = nhận diện mặt chữ, tính nhẹ đi

quality:
  embeddings: auto          # auto | ollama | off — tìm câu trùng theo nghĩa bằng model embedding chạy trên máy (Ollama)
  ollama_url: "http://127.0.0.1:11434"
  embedding_model: embeddinggemma   # ollama pull embeddinggemma (hoặc nomic-embed-text)
  semantic_threshold: 0.88  # độ tương đồng cosine ≥ ngưỡng = nghi trùng

server:
  lan: false                # true = mở cho điện thoại trong cùng mạng Wi-Fi (cần mã truy cập, xem trang 🧰 Công cụ)

export:
  anki_deck: "AWS SAA-C03"  # tên deck khi xuất sang Anki
  ankiconnect_url: "http://127.0.0.1:8765"

cache:
  sqlite: true              # chỉ mục SQLite dựng lại được (trainer/.cache/, không đưa lên git): khởi động nhanh + tìm kiếm toàn văn

sync:
  data_paths: [trainer/results, trainer/coach, trainer/bank]   # thư mục được "⇅ Đồng bộ" commit + push
  before_ai: true           # AI Coach (phân tích, sinh câu, ENRICH, câu dài) tự đồng bộ TRƯỚC khi chạy → thấy cả bài làm của máy kia
  after_ai: true            # ...và tự đẩy kết quả AI (kế hoạch, câu mới, patch, hồ sơ) lên ngay SAU lượt chạy thành công
  auto: idle                # idle = tự đồng bộ vài phút sau khi nộp bài (và kéo về khi mở app, đẩy lên khi tắt) · off = chỉ khi bấm ⇅
  auto_delay_minutes: 4
