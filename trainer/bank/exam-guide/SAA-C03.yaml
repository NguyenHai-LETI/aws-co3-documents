        skills:
          - "Determining an appropriate load balancing strategy (for example, Application Load Balancer [Layer 7] compared with Network Load Balancer [Layer 4] compared with Gateway Load Balancer)" # 4.2.s1
          - "Determining appropriate scaling methods and strategies for elastic workloads (for example, horizontal compared with vertical, EC2 hibernation)" # 4.2.s2
          - "Determining cost-effective AWS compute services with appropriate use cases (for example, AWS Lambda, Amazon EC2, AWS Fargate)" # 4.2.s3
          - "Determining the required availability for different classes of workloads (for example, production workloads, non-production workloads)" # 4.2.s4
          - "Selecting the appropriate instance family for a workload" # 4.2.s5
          - "Selecting the appropriate instance size for a workload" # 4.2.s6
      - id: "4.3"
        title: "Design cost-optimized database solutions"
        knowledge:
          - "AWS cost management service features (for example, cost allocation tags, multi-account billing)" # 4.3.k1
          - "AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)" # 4.3.k2
          - "Caching strategies" # 4.3.k3
          - "Data retention policies" # 4.3.k4
          - "Database capacity planning (for example, capacity units)" # 4.3.k5
          - "Database connections and proxies" # 4.3.k6
          - "Database engines with appropriate use cases (for example, heterogeneous migrations, homogeneous migrations)" # 4.3.k7
          - "Database replication (for example, read replicas)" # 4.3.k8
          - "Database types and services (for example, relational compared with non-relational, Amazon Aurora, Amazon DynamoDB)" # 4.3.k9
        skills:
          - "Designing appropriate backup and retention policies (for example, snapshot frequency)" # 4.3.s1
          - "Determining an appropriate database engine (for example, MySQL compared with PostgreSQL)" # 4.3.s2
          - "Determining cost-effective AWS database services with appropriate use cases (for example, DynamoDB compared with Amazon RDS, serverless)" # 4.3.s3
          - "Determining cost-effective AWS database types (for example, time series format, columnar format)" # 4.3.s4
          - "Migrating database schemas and data to different locations and/or different database engines" # 4.3.s5
      - id: "4.4"
        title: "Design cost-optimized network architectures"
        knowledge:
          - "AWS cost management service features (for example, cost allocation tags, multi-account billing)" # 4.4.k1
          - "AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)" # 4.4.k2
          - "Load balancing concepts (for example, Application Load Balancer [ALB])" # 4.4.k3
