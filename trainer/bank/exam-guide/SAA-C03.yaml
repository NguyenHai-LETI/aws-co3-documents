          - "Backup strategies" # 4.1.k5
          - "Block storage options (for example, hard disk drive [HDD] volume types, solid state drive [SSD] volume types)" # 4.1.k6
          - "Data lifecycles" # 4.1.k7
          - "Hybrid storage options (for example, AWS DataSync, AWS Transfer Family, AWS Storage Gateway)" # 4.1.k8
          - "Storage access patterns" # 4.1.k9
          - "Storage tiering (for example, cold tiering for object storage)" # 4.1.k10
          - "Storage types with associated characteristics (for example, object, file, block)" # 4.1.k11
        skills:
          - "Designing appropriate storage strategies (for example, batch uploads to Amazon S3 compared with individual uploads)" # 4.1.s1
          - "Determining the correct storage size for a workload" # 4.1.s2
          - "Determining the lowest cost method of transferring data for a workload to AWS storage" # 4.1.s3
          - "Determining when storage auto scaling is required" # 4.1.s4
          - "Managing S3 object lifecycles" # 4.1.s5
          - "Selecting the appropriate backup and/or archival solution" # 4.1.s6
          - "Selecting the appropriate service for data migration to storage services" # 4.1.s7
          - "Selecting the appropriate storage tier" # 4.1.s8
          - "Selecting the correct data lifecycle for storage" # 4.1.s9
          - "Selecting the most cost-effective storage service for a workload" # 4.1.s10
      - id: "4.2"
        title: "Design cost-optimized compute solutions"
        knowledge:
          - "AWS cost management service features (for example, cost allocation tags, multi-account billing)" # 4.2.k1
          - "AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)" # 4.2.k2
          - "AWS global infrastructure (for example, Availability Zones, AWS Regions)" # 4.2.k3
