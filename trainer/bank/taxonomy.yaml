  - id: aurora-serverless-v1-eol
    pattern: 'Aurora Serverless\s*(?:v1\b|\(v1\)|version 1\b)|\bServerless v1\b'
    unless: '(?:end[- ]of[- ]life|EOL|hết (?:vòng đời|hỗ trợ)|đã ngừng)'
    fact: 'Aurora Serverless v1 hết vòng đời ngày 2025-03-31 (không tạo mới từ 2025-01-08) — dùng Aurora Serverless v2 (nay gọi "Aurora serverless")'
