# ─────────────────────────────────────────────────────────────────────────────
# TAXONOMY — từ điển dùng chung cho ngân hàng câu hỏi (app + AI coach đều đọc file này)
#
# - exam / domains : thông số kỳ thi SAA-C03 (dùng cho chế độ "Thi thử" và chấm điểm)
# - topics         : chủ đề (= chương tài liệu). `notes` = file lý thuyết liên quan ở thư mục gốc
# - timing         : rubric ước lượng thời gian làm 1 câu (xem bank/SCHEMA.md §4)
# - services       : tên service chuẩn → topic + các chuỗi nhận diện (dùng để gắn `services`)
# - features       : tag khái niệm (kebab-case) → các chuỗi nhận diện (dùng để gắn `tags`)
#
# Quy tắc khớp chuỗi (match):
#   • services : pattern 1 từ → phân biệt hoa/thường; pattern nhiều từ → không phân biệt
#   • features : không phân biệt hoa/thường, TRỪ pattern viết HOA toàn bộ (acronym như SCP, RTO)
#   • kết thúc bằng `*` = khớp tiền tố (vd `decoupl*` khớp decouple/decoupled/decoupling)
# Phạm vi đề thi (service):
#   • scope: out  = nằm trong danh sách NGOÀI PHẠM VI chính thức của SAA-C03 (saa-03-out-of-scope-services, đối chiếu
#     2026-10-20) — đề thật không hỏi. Câu có đáp án đúng nêu service này = "ngoài phạm vi" (lint oos-answer, bị loại khỏi
#     các chế độ luyện khi practice.exclude_out_of_scope); nêu ở phương án nhiễu = lint oos-distractor.
#     Không ghi scope = trong phạm vi hoặc chưa được liệt kê (danh sách chính thức không đầy đủ) — không bị loại.
#     "AWS Tools and SDKs" cũng ngoài phạm vi nhưng không đưa vào đây: đáp án đúng hay *dùng* SDK như một phần giải pháp.
#   • scope: legacy = [v6] bị GỠ khỏi danh sách trong phạm vi chính thức (saa-03-in-scope-services, đối chiếu 2026-10-22:
#     https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/saa-03-in-scope-services.html) hoặc đã
#     ngừng mà dịch vụ kế nhiệm nằm ngoài phạm vi (Elastic Transcoder → MediaConvert). App coi như scope: out (oos-*, loại khỏi
#     luyện / thi thử / đề niêm phong); coverage.ts liệt kê riêng ở mục "Dịch vụ bị gỡ khỏi phạm vi đề".
#     Gỡ khỏi in-scope: Data Pipeline, AppSync, QLDB, Pinpoint, Forecast, Fraud Detector, Kendra, Proton, Application Discovery
#     Service, Migration Hub, Audit Manager. Ngừng hẳn: Elastic Transcoder (2025-11-13).
#   • aliases     = tên chính thức hiện tại / tên mới trong exam guide (vd QuickSight → Amazon Quick). Chỉ để hiển thị và để AI
#     viết đúng tên — muốn nhận diện tên đó trong câu hỏi thì phải có trong `match`.
# AI coach được phép BỔ SUNG service/feature mới vào đây (không xoá/đổi tên cái cũ).
# ─────────────────────────────────────────────────────────────────────────────

exam:
  code: SAA-C03
  name: AWS Certified Solutions Architect – Associate
  questions: 65          # 50 tính điểm + 15 thử nghiệm
  duration_min: 130
  esl_extra_min: 30      # thí sinh không dùng tiếng Anh bản ngữ được +30 phút
  pass_scaled: 720       # thang 100–1000
  pass_pct: 72

domains:
  - { id: secure,      code: D1, weight: 30, label: "Design Secure Architectures",          label_vi: "Kiến trúc bảo mật" }
  - { id: resilient,   code: D2, weight: 26, label: "Design Resilient Architectures",       label_vi: "Kiến trúc bền vững / HA / DR" }
  - { id: performance, code: D3, weight: 24, label: "Design High-Performing Architectures",  label_vi: "Kiến trúc hiệu năng cao" }
  - { id: cost,        code: D4, weight: 20, label: "Design Cost-Optimized Architectures",   label_vi: "Kiến trúc tối ưu chi phí" }

# Mục tiêu chi tiết (task statements) trong AWS SAA-C03 Exam Guide — gắn vào câu hỏi bằng `- task: 2.2`
tasks:
  - { id: "1.1", domain: secure,      label: "Design secure access to AWS resources",                       label_vi: "Truy cập an toàn tới tài nguyên AWS (IAM, Organizations, federation)" }
  - { id: "1.2", domain: secure,      label: "Design secure workloads and applications",                    label_vi: "Workload/ứng dụng an toàn (VPC security, WAF, Shield, Cognito, secrets)" }
  - { id: "1.3", domain: secure,      label: "Determine appropriate data security controls",                label_vi: "Bảo vệ dữ liệu (mã hoá, KMS, backup/retention, compliance)" }
  - { id: "2.1", domain: resilient,   label: "Design scalable and loosely coupled architectures",           label_vi: "Kiến trúc mở rộng & decoupled (SQS/SNS/EventBridge, serverless, scaling)" }
  - { id: "2.2", domain: resilient,   label: "Design highly available and/or fault-tolerant architectures", label_vi: "HA / fault tolerance / DR (Multi-AZ, Multi-Region, backup)" }
  - { id: "3.1", domain: performance, label: "Determine high-performing and/or scalable storage solutions", label_vi: "Lưu trữ hiệu năng cao (S3, EBS, EFS, FSx)" }
  - { id: "3.2", domain: performance, label: "Design high-performing and elastic compute solutions",        label_vi: "Compute hiệu năng & co giãn (EC2, Auto Scaling, Lambda, containers)" }
  - { id: "3.3", domain: performance, label: "Determine high-performing database solutions",                label_vi: "Database hiệu năng cao (RDS/Aurora, DynamoDB, caching)" }
  - { id: "3.4", domain: performance, label: "Determine high-performing and/or scalable network architectures", label_vi: "Mạng hiệu năng cao (CloudFront, Global Accelerator, ELB, DX)" }
  - { id: "3.5", domain: performance, label: "Determine high-performing data ingestion and transformation solutions", label_vi: "Thu thập & xử lý dữ liệu (Kinesis, Glue, EMR, Athena, DataSync)" }
  - { id: "4.1", domain: cost,        label: "Design cost-optimized storage solutions",                     label_vi: "Lưu trữ tối ưu chi phí (storage class, lifecycle)" }
  - { id: "4.2", domain: cost,        label: "Design cost-optimized compute solutions",                     label_vi: "Compute tối ưu chi phí (Spot, RI, Savings Plans, right-sizing)" }
  - { id: "4.3", domain: cost,        label: "Design cost-optimized database solutions",                    label_vi: "Database tối ưu chi phí (serverless, capacity mode, caching)" }
  - { id: "4.4", domain: cost,        label: "Design cost-optimized network architectures",                 label_vi: "Mạng tối ưu chi phí (data transfer, NAT, VPC endpoints)" }

# Từ khoá được tô sáng khi làm bài (bật/tắt 🖍 trong màn hình làm bài). Cụm VIẾT HOA phân biệt hoa/thường.
keywords:
  qualifier: [MOST, LEAST, BEST, NOT, EXCEPT, FIRST, TWO, THREE]
  cost: [MOST cost-effective, LEAST expensive, cost-effective, cost-effectively, lowest cost, cheapest, minimize cost, minimize costs, reduce cost, reduce costs, without upfront, pay only for]
  ops: [LEAST operational overhead, operational overhead, least operational effort, minimal operational, fully managed, serverless, without managing, minimal changes, fewest changes, LEAST development effort, least amount of effort, quickly]
  resilient: [highly available, high availability, fault-tolerant, fault tolerant, disaster recovery, failover, durable, durability, RPO, RTO, decouple, decoupled, loosely coupled, survive, outage, data loss]
  performance: [lowest latency, low latency, high throughput, throughput, latency, performance, real-time, real time, milliseconds, microseconds, millions of requests, spiky, unpredictable, burst]
  secure: [MOST secure, least privilege, least-privilege, encrypt, encrypted, encryption, at rest, in transit, compliance, audit, unauthorized, without traversing the internet, private connectivity, publicly accessible]

difficulties:
  - { id: easy,   label: "Dễ" }
  - { id: medium, label: "Vận dụng" }
  - { id: hard,   label: "Khó / Nâng cao" }

