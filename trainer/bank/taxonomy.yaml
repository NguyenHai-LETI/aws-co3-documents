    unless: 'cross-Region (?:connectivity|PrivateLink)|PrivateLink liên Region'
    fact: 'PrivateLink kết nối được liên Region từ 2024-11-26 (interface endpoint tới endpoint service ở Region khác cùng partition) — "PrivateLink chỉ trong một Region" đã lỗi thời'
