    fact: 'Amazon RDS Custom for Oracle bị khai tử: giai đoạn chuyển đổi từ 2026-03-31, hết hỗ trợ 2027-03-31 — AWS khuyên chạy Oracle tự quản trên EC2'
    since: '2026-03-31'
    url: 'https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS-Custom-for-Oracle-end-of-support.html'
  - id: qldb-end-of-support
    pattern: '\bQLDB\b|Quantum Ledger'
