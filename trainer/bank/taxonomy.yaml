# ── Kiến thức đã thay đổi (lint `stale-fact`, mức vừa) ─────────────────────────────────────────────────────────────
# Mỗi mục đã đối chiếu trên trang chính thức của AWS (url) ngày 2026-10-20 — KHÔNG thêm mục chỉ dựa vào trí nhớ.
# pattern = regex (không phân biệt hoa thường) trên đề + phương án + giải thích, nói kiến thức cũ; unless = câu đã dùng cách
# viết hiện hành (vd tên mới) thì bỏ qua. Sửa câu: viết "tên mới (tên cũ)" / giới hạn mới, đừng xoá kiến thức cũ khỏi giải thích.
# [v6] 2026-10-22: thêm các mục từ research mục 9, mỗi mục đã mở trang nguồn (url) ngày 2026-10-22. Snowmobile / QLDB / OpsWorks nay
# đối chiếu được qua danh sách full shutdown. Snowball Edge (vẫn "AWS Snow Family" trong đề cương): mục snowball-edge-closed chỉ bắt
# giải thích GỢI Ý Snowball (= Snowball …) mà chưa ghi chú trạng thái — giữ đáp án, thêm ghi chú. CodeCommit đã mở lại (2025-11-24).
# Cố ý không đưa vào (không viết được regex "kiến thức cũ" đủ chính xác): S3 ACL tắt mặc định, SSE-C tắt mặc định cho bucket mới,
# Regional NAT gateway, IMDSv2 mặc định, giá DynamoDB on-demand, EFS Elastic Throughput mặc định (không tìm được ngày chính thức).
currency:
  - id: sqs-max-message-1mib
    pattern: '(SQS|queue|message)[^.\n]{0,80}256\s?(KB|KiB)|256\s?(KB|KiB)[^.\n]{0,80}(SQS|queue|messag)'
    fact: 'Amazon SQS cho phép message tối đa 1 MiB (trước đó 256 KiB)'
    since: '2025-08-04'
    url: 'https://aws.amazon.com/about-aws/whats-new/2025/08/amazon-sqs-max-payload-size-1mib/'
  - id: data-firehose-rename
    pattern: 'Kinesis (Data )?Firehose'
    unless: 'Amazon Data Firehose'
    fact: 'Amazon Kinesis Data Firehose đã đổi tên thành Amazon Data Firehose'
    since: '2024-02-09'
    url: 'https://aws.amazon.com/about-aws/whats-new/2024/02/amazon-data-firehose-formerly-kinesis-data-firehose'
  - id: managed-flink-rename
    pattern: 'Kinesis Data Analytics'
    unless: 'Managed Service for Apache Flink'
    fact: 'Amazon Kinesis Data Analytics đã đổi tên thành Amazon Managed Service for Apache Flink'
    since: '2023-08-30'
    url: 'https://aws.amazon.com/about-aws/whats-new/2023/08/amazon-managed-service-apache-flink/'
  - id: snowcone-discontinued
    pattern: 'Snowcone'
    fact: 'AWS Snowcone đã ngừng (không đặt được thiết bị mới; hỗ trợ khách cũ tới 2025-11-12)'
    since: '2024-11-12'
    url: 'https://aws.amazon.com/blogs/storage/aws-snow-device-updates/'
  - id: cloud9-closed
    pattern: 'Cloud9'
    fact: 'AWS Cloud9 không nhận khách hàng mới (khách cũ dùng tiếp)'
    since: '2024-07-25'
    url: 'https://aws.amazon.com/blogs/devops/how-to-migrate-from-aws-cloud9-to-aws-ide-toolkits-or-aws-cloudshell/'
  - id: s3-select-closed
    pattern: 'S3 Select|Glacier Select'
    fact: 'Amazon S3 Select và S3 Glacier Select không nhận khách hàng mới — truy vấn dữ liệu trên S3 nên dùng Athena'
    since: '2024-07-25'
    url: 'https://aws.amazon.com/blogs/storage/how-to-optimize-querying-your-data-in-amazon-s3/'
  - id: forecast-closed
    pattern: 'Amazon Forecast'
    fact: 'Amazon Forecast không nhận khách hàng mới (AWS gợi ý SageMaker Canvas)'
    since: '2024-07-29'
    url: 'https://aws.amazon.com/blogs/machine-learning/transition-your-amazon-forecast-usage-to-amazon-sagemaker-canvas/'
  - id: data-pipeline-closed
    pattern: 'AWS Data Pipeline|\bData Pipeline\b'
    fact: 'AWS Data Pipeline không nhận khách hàng mới, ở chế độ bảo trì (không thêm tính năng)'
    since: '2024-07-25'
    url: 'https://aws.amazon.com/blogs/big-data/migrate-workloads-from-aws-data-pipeline/'
  - id: pinpoint-end-of-support
    pattern: 'Pinpoint'
    fact: 'Amazon Pinpoint không nhận khách mới từ 2025-05-20 và ngừng hỗ trợ ngày 2026-10-30 (SMS / voice / push: AWS End User Messaging; email: Amazon SES)'
    since: '2025-05-20'
    url: 'https://docs.aws.amazon.com/pinpoint/latest/userguide/migrate.html'
  - id: sagemaker-ai-rename
    pattern: 'SageMaker'
    unless: 'SageMaker AI|SageMaker (Unified Studio|Lakehouse|Catalog|Canvas)'
    fact: 'Amazon SageMaker (dịch vụ ML) đã đổi tên thành Amazon SageMaker AI — tên dùng trong đề cương SAA-C03'
    since: '2024-12-03'
    url: 'https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html'
  - id: quicksight-quick
    pattern: 'QuickSight'
    unless: 'Amazon Quick\b'
    fact: 'Amazon QuickSight đã thành Amazon Quick Suite (2025-10-09); đề cương SAA-C03 hiện ghi “Amazon Quick”'
    since: '2025-10-09'
    url: 'https://aws.amazon.com/blogs/business-intelligence/reimagine-business-intelligence-amazon-quicksight-evolves-to-amazon-quick-suite · https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/saa-03-in-scope-services.html'
  # ── S3
  - id: s3-sse-s3-by-default
    pattern: '(?:S3|bucket|object)[^.\n]{0,60}\b(?:not|aren.t|isn.t|never)\s+encrypted\s+by\s+default|(?:S3|bucket|object)[^.\n]{0,60}không\s+(?:được\s+)?mã\s+h(?:oá|óa)\s+mặc\s+định|(?:enable|turn\s+on|bật)\s+(?:the\s+)?(?:S3\s+|bucket\s+)?default\s+encryption(?![^.\n]{0,50}(?:KMS|DSSE))'
    unless: 'automatically (?:applies|encrypts?)|tự động mã\s+h(?:oá|óa)|SSE-S3[^.\n]{0,40}(?:by default|mặc định|automatic)'
    fact: 'S3 tự mã hoá mọi object mới bằng SSE-S3 từ 2023-01-05 (không tắt được) — "bật default encryption để object được mã hoá" đã lỗi thời; câu mã hoá nên xoay quanh SSE-KMS / S3 Bucket Key'
    since: '2023-01-05'
    url: 'https://aws.amazon.com/about-aws/whats-new/2023/01/amazon-s3-automatically-encrypts-new-objects/'
  - id: s3-object-max-50tb
    pattern: '(?:max(?:imum)?|largest|up to|tối đa|lớn nhất)[^.\n]{0,30}(?:object|đối tượng)[^.\n]{0,30}\b5\s?TB\b|(?:object|đối tượng)s?[^.\n]{0,40}(?:max(?:imum)?|up to|tối đa|limit(?:ed)?|lớn nhất|cap)[^.\n]{0,20}\b5\s?TB\b|\b5\s?TB\b[^.\n]{0,40}(?:max(?:imum)?|limit)[^.\n]{0,30}(?:object|đối tượng)'
    unless: '\b50\s?TB\b'
    fact: 'Object S3 tối đa 50 TB từ 2025-12-02 (trước đó 5 TB)'
    since: '2025-12-02'
    url: 'https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-s3-maximum-object-size-50-tb/'
  - id: s3-object-lambda-closed
    pattern: 'Object Lambda'
    unless: '(?:only|chỉ)[^.\n]{0,40}(?:existing customers|khách hàng hiện có)|no longer (?:open|available)|closed to new|không (?:còn )?nhận khách'
    fact: 'S3 Object Lambda chỉ còn cho khách hàng hiện có từ 2025-11-07 — biến đổi dữ liệu khi đọc: Lambda gọi qua CloudFront / API Gateway / Function URL'
    since: '2025-11-07'
    url: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html'
  - id: s3-mountable-file-system
    pattern: '(?:\bS3\b|buckets?)[^.\n]{0,60}(?:cannot|can.t|can not|không thể)\s+(?:be\s+)?(?:mount\w*|gắn)|(?:cannot|can.t|can not|không thể)\s+(?:be\s+)?mount\w*[^.\n]{0,40}(?:\bS3\b|buckets?)'
    unless: 'Mountpoint|S3 Files'
    fact: 'S3 mount được như file system: Mountpoint for Amazon S3 (file client, GA 2023-08-09) và S3 Files (NFS v4.1+, từ 2026-04-07) — cần POSIX đầy đủ / chia sẻ file truyền thống vẫn chọn EFS / FSx'
    since: '2023-08-09'
    url: 'https://aws.amazon.com/about-aws/whats-new/2023/08/mountpoint-amazon-s3-generally-available/ · https://aws.amazon.com/blogs/aws/launching-s3-files-making-s3-buckets-accessible-as-file-systems/'
  - id: glacier-vaults-closed
    pattern: 'Glacier\s+(?:Vault Lock|vaults?)\b|\bvaults?\s+(?:in|of|on)\s+(?:Amazon\s+|S3\s+)?Glacier\b|\bVault Lock polic(?:y|ies)|Glacier (?:API|Direct)\b'
    unless: 'no longer accept|closed to new|not (?:open|available) to new|không (?:còn )?nhận khách'
    fact: 'Amazon Glacier dạng vault (Glacier API, Vault Lock) không nhận khách hàng mới từ 2025-12-15 — dữ liệu lưu trữ mới: lớp S3 Glacier + Lifecycle, WORM bằng S3 Object Lock'
    since: '2025-12-15'
    url: 'https://aws.amazon.com/s3/glacier/pricing/'
  # ── Snow Family / chuyển dữ liệu
  - id: snowball-edge-closed
    pattern: '(?:=|→|->)\s*(?:use\s+|order\s+|dùng\s+)?(?:an?\s+|the\s+)?(?:AWS\s+)?(?:Snowball|Snow Family)\b|(?:Snowball|Snow Family)[^.\n]{0,40}\b(?:is|are)\s+(?:the\s+)?(?:best|right|recommended|correct)\b'
    unless: '(?:only|chỉ)[^.\n]{0,40}(?:existing customers|khách hàng hiện có|khách cũ)|no longer (?:available|offered|open)|(?:closed|not available) to new|không (?:còn )?nhận khách|Data Transfer Terminal|ngừng hỗ trợ'
    fact: 'AWS Snowball Edge chỉ còn cho khách hàng hiện có từ 2025-11-07, ngừng hỗ trợ thiết bị ngày 2026-12-31 (thiết kế mới: DataSync, DataSync + Direct Connect, AWS Data Transfer Terminal) — đề cương SAA-C03 vẫn ghi "AWS Snow Family": giữ đáp án, ghi chú trạng thái trong giải thích'
    since: '2025-11-07'
    url: 'https://aws.amazon.com/snowball/faqs/ · https://aws.amazon.com/snowball/ · https://docs.aws.amazon.com/snowball/latest/developer-guide/snowball-edge-availability-change.html'
  - id: snowmobile-retired
    pattern: 'Snowmobile'
    unless: 'retired|discontinued|no longer (?:available|offered)|full shutdown|đã ngừng|ngừng (?:hoạt động|cung cấp)'
    fact: 'AWS Snowmobile đã ngừng hẳn (2024-03-14) — không được là đáp án; dữ liệu cỡ PB: DataSync qua Direct Connect, AWS Data Transfer Terminal'
    since: '2024-03-14'
    url: 'https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html'
