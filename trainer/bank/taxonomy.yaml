    since: '2022-10-20'
    url: 'https://aws.amazon.com/about-aws/whats-new/2022/10/amazon-rds-mysql-mariadb-postgre-sql-support-15-read-replicas-3x-read-capacity/'
  - id: aurora-global-database-10-regions
    pattern: 'Global Database[^.\n]{0,80}(?:up to|maximum(?: of)?|max\.?|tối đa)\s*(?:5|five)\s+(?:secondary\s+)?(?:AWS\s+)?Regions?|(?:up to|maximum(?: of)?|max\.?|tối đa)\s*(?:5|five)\s+(?:secondary\s+)?(?:AWS\s+)?Regions?[^.\n]{0,60}Global Database|\b(?:5|five)\s+secondary (?:AWS )?Regions'
    unless: '\b10 (?:secondary )?(?:AWS )?Regions?'
    fact: 'Aurora Global Database hỗ trợ tới 10 Region phụ từ 2025-05-22 (trước đó 5)'
    since: '2025-05-22'
    url: 'https://aws.amazon.com/blogs/database/amazon-aurora-global-database-introduces-support-for-up-to-10-secondary-regions/'
  - id: dynamodb-global-tables-strong-consistency
    pattern: 'global tables?[^.\n]{0,80}(?:only|chỉ)[^.\n]{0,30}eventual\w*|eventual(?:ly)?\s+consisten\w*[^.\n]{0,40}(?:only|chỉ)[^.\n]{0,40}global tables?|global tables?[^.\n]{0,80}(?:do(?:es)?\s+not|don.t|doesn.t|cannot|can.t|can not|không(?: thể)?)\s+(?:(?:support|provide|offer|hỗ trợ|cung cấp)\w*\s+)?(?:strong(?:ly)?|mạnh)'
    unless: 'multi-Region strong consistency|\bMRSC\b'
    fact: 'DynamoDB global tables có chế độ nhất quán mạnh đa Region (MRSC, RPO = 0) từ 2025-06-30 — "global tables chỉ eventually consistent" đã lỗi thời'
    since: '2025-06-30'
    url: 'https://aws.amazon.com/about-aws/whats-new/2025/06/amazon-dynamo-db-global-tables-multi-region-strong-consistency-generally-available/'
  - id: database-savings-plans
    pattern: '(?<!(?:Compute|Instance)\s)Savings Plans?[^.\n]{0,80}(?:do(?:es)?\s+not|don.t|doesn.t|cannot|can.t|can not|không)\s+(?:(?:apply|cover|include|support|áp dụng|bao gồm|giảm)\w*\s+)?(?:to\s+|for\s+|cho\s+)?(?:Amazon\s+)?(?:RDS|Aurora|DynamoDB|ElastiCache|databases?|cơ sở dữ liệu)|(?:only|chỉ(?: có)?)\s+(?:RDS\s+|DB\s+)?Reserved (?:DB )?Instances?[^.\n]{0,60}(?:RDS|databases?|Aurora|cơ sở dữ liệu)|(?:RDS|Aurora|databases?|cơ sở dữ liệu)[^.\n]{0,60}(?:only|chỉ(?: có)?)\s+(?:(?:RDS|DB)\s+)?Reserved (?:DB )?Instances?'
    unless: 'Database Savings Plans?'
    fact: 'Database Savings Plans (từ 2025-12-02): cam kết USD/giờ 1 năm, không trả trước, giảm tới 35 % cho Aurora, RDS, DynamoDB, ElastiCache, DocumentDB, Neptune, Keyspaces, Timestream, DMS — "chỉ Reserved Instance mới giảm giá database" đã lỗi thời'
    since: '2025-12-02'
    url: 'https://aws.amazon.com/about-aws/whats-new/2025/12/database-savings-plans-savings/'
  - id: rds-extended-support
