    url: 'https://docs.aws.amazon.com/migrationhub/latest/ug/migrationhub-availability-change.html'
  - id: application-discovery-service-closed
    pattern: 'Application Discovery Service|Discovery (?:Agent|Connector)'
    unless: 'AWS Transform|no longer (?:open|available)|closed to new|không (?:còn )?nhận khách|khách hàng hiện có'
    fact: 'AWS Application Discovery Service không nhận khách hàng mới từ 2025-11-07 và đã bị gỡ khỏi phạm vi đề — AWS gợi ý AWS Transform'
    since: '2025-11-07'
    url: 'https://docs.aws.amazon.com/application-discovery/latest/userguide/application-discovery-service-availability-change.html'
  - id: server-migration-service-shutdown
    pattern: 'Server Migration Service'
    unless: 'full shutdown|đã ngừng|discontinu'
    fact: 'AWS Server Migration Service (SMS) đã ngừng hẳn (2023-04-01) — dịch vụ rehost trong đề cương: AWS Application Migration Service'
    since: '2023-04-01'
    url: 'https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html'
  - id: opsworks-shutdown
    pattern: 'OpsWorks'
    unless: 'full shutdown|đã ngừng|discontinu|end of life'
    fact: 'AWS OpsWorks (Stacks, Chef Automate, Puppet Enterprise) đã ngừng hẳn (2024-05-01) — không được là đáp án'
    since: '2024-05-01'
    url: 'https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html'
  - id: proton-end-of-support
    pattern: '\bAWS Proton\b|\bProton\b'
    unless: 'end of support|hết hỗ trợ|discontinu|đã ngừng'
    fact: 'AWS Proton không nhận khách mới từ 2025-10-07 và hết hỗ trợ ngày 2026-10-07, đã bị gỡ khỏi phạm vi đề'
    since: '2026-10-07'
    url: 'https://docs.aws.amazon.com/proton/latest/userguide/proton-end-of-support.html'
  # ── ML / ứng dụng khác
  - id: fraud-detector-closed
    pattern: 'Fraud Detector'
    unless: 'no longer (?:open|available)|closed to new|không (?:còn )?nhận khách|khách hàng hiện có'
    fact: 'Amazon Fraud Detector không nhận khách hàng mới từ 2025-11-07 và đã bị gỡ khỏi phạm vi đề (AWS gợi ý AutoGluon + SageMaker AI, AWS WAF Fraud Control)'
    since: '2025-11-07'
    url: 'https://docs.aws.amazon.com/frauddetector/latest/ug/frauddetector-availability-change.html'
  - id: kendra-maintenance
    pattern: 'Kendra'
    unless: 'maintenance mode|chế độ bảo trì|no longer (?:open|available)|không (?:còn )?nhận khách|Bedrock (?:Managed )?Knowledge Bases?'
    fact: 'Amazon Kendra vào chế độ bảo trì từ 2026-06-30, không nhận khách mới từ 2026-07-30 và đã bị gỡ khỏi phạm vi đề — AWS gợi ý Amazon Bedrock Knowledge Bases'
    since: '2026-07-30'
    url: 'https://docs.aws.amazon.com/kendra/latest/dg/kendra-availability-change.html'
  - id: workdocs-shutdown
    pattern: 'WorkDocs'
    unless: 'full shutdown|đã ngừng|discontinu'
    fact: 'Amazon WorkDocs đã ngừng hoạt động hoàn toàn (2025-04-25)'
    since: '2025-04-25'
    url: 'https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html'
  - id: chime-end-of-support
    pattern: 'Amazon Chime\b(?!\s+SDK)'
    unless: 'end of support|hết hỗ trợ|đã ngừng|discontinu'
    fact: 'Amazon Chime (họp / gọi điện) không nhận khách mới từ 2025-02-19 và ngừng hỗ trợ ngày 2026-02-20 (Amazon Chime SDK không bị ảnh hưởng)'
    since: '2026-02-20'
    url: 'https://aws.amazon.com/blogs/messaging-and-targeting/update-on-support-for-amazon-chime/'
