  - id: lambda-tmp-10gb
    pattern: '(?:/tmp|ephemeral storage|temporary storage|lưu trữ tạm(?: thời)?)[^.\n]{0,40}(?:limit(?:ed)?(?: to)?|max(?:imum)?|only|up to|at most|tối đa|chỉ(?: có)?)[^.\n]{0,20}\b512\s?MB\b|\b512\s?MB\b[^.\n]{0,30}(?:limit|max(?:imum)?|tối đa)[^.\n]{0,40}(?:/tmp|ephemeral|temporary storage|lưu trữ tạm)'
    unless: '10[.,]?240\s?MB|10\s?GB'
