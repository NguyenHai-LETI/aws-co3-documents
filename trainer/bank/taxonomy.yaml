    since: '2026-09-18'
    url: 'https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-sns-1mib-support/'
  - id: api-gateway-timeout-above-29s
    pattern: '\b29[- ]?(?:s|sec|seconds?|giây)\b[^.\n]{0,60}(?:hard (?:limit|cap)|cannot be (?:increased|changed|raised|extended)|không (?:thể )?(?:tăng|đổi|nâng))|(?:hard|fixed|maximum|max|tối đa|cứng)[^.\n]{0,30}(?:integration\s+)?timeout[^.\n]{0,20}\b29[- ]?(?:s|sec|seconds?|giây)\b|API Gateway[^.\n]{0,60}\b29[- ]?(?:s|sec|seconds?|giây)\b[^.\n]{0,30}(?:limit|max(?:imum)?|tối đa|giới hạn|hard)|(?:hard|fixed)\s+(?:limit|cap|timeout)\s+(?:of\s+)?29[- ]?(?:s|sec|seconds?|giây)\b|API Gateway[^.\n]{0,60}(?:hard|fixed|maximum|max|tối đa|cứng)[^.\n]{0,30}\b29[- ]?(?:s|sec|seconds?|giây)\b'
    unless: '(?:raise|increase|request|tăng)[^.\n]{0,40}(?:beyond|above|over|past|vượt|hơn|quá)\s+29'
    fact: 'API Gateway REST API (Regional / private) tăng được integration timeout quá 29 giây từ 2024-06-04 (xin quota, có thể phải giảm throttle) — "29 giây là giới hạn cứng" không còn tuyệt đối'
