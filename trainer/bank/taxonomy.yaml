# Ước lượng thời gian 1 câu (giây) — chuẩn SAA-C03: 130 phút / 65 câu = 120 s/câu cho câu dài
# chuẩn (~170 từ gồm cả đáp án). Công thức (xem SCHEMA.md §4):
#   time = clamp( round_to( words × 60 / wpm + think[difficulty] + multi_bonus ), min, max )
timing:
  official_seconds_per_question: 120
  words_per_minute: 130
  think_seconds: { easy: 30, medium: 40, hard: 55 }
  multi_bonus_seconds: { "2": 20, "3": 30 }
  min_seconds: 45
  max_seconds: 180
  round_to: 5
  long_form_min_words: 55   # đề (stem) từ 55 từ trở lên = "câu dài chuẩn thi thật"

