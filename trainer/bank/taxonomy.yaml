  - id: cloudfront-anycast-static-ips
    pattern: 'CloudFront[^.\n]{0,80}(?:does not|doesn.t|do not|don.t|cannot|can.t|can not|không(?: thể)?)\s+(?:(?:provide|offer|support|give|have|cung cấp|có|hỗ trợ)\w*\s+)?(?:an?\s+|any\s+)?(?:static|fixed|tĩnh)\s+IPs?|(?:static|fixed) IPs?[^.\n]{0,60}(?:not (?:available|supported|possible)|không (?:có|hỗ trợ))[^.\n]{0,40}CloudFront|IP tĩnh[^.\n]{0,40}không[^.\n]{0,20}CloudFront'
