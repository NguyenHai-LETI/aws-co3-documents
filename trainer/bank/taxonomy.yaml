  - id: ebs-gp3-64tib-80k-iops
    pattern: '\bgp3\b[^.\n]{0,80}\b16[.,]?000\s+IOPS|\bgp3\b[^.\n]{0,80}\b1[.,]?000\s+MiB/s|\bgp3\b[^.\n]{0,60}\b16\s?TiB|(?:more than|above|over|exceed(?:s|ing)?|beyond|greater than|>|vượt|trên|hơn)\s*16[.,]?000\s+IOPS[^.\n]{0,60}(?:\bio1\b|\bio2\b|Provisioned IOPS)|(?:\bio1\b|\bio2\b|Provisioned IOPS)[^.\n]{0,60}(?:more than|above|over|exceed(?:s|ing)?|beyond|greater than|>|vượt|trên|hơn)\s*16[.,]?000\s+IOPS'
    unless: '80[.,]?000\s+IOPS'
    fact: 'EBS gp3 tới 64 TiB, 80.000 IOPS, 2.000 MiB/s từ 2025-09-26 (trước đó 16 TiB / 16.000 IOPS / 1.000 MiB/s) — "> 16.000 IOPS bắt buộc io1/io2" đã lỗi thời'
