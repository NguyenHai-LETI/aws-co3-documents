    unless: 'no longer (?:open|available)|closed to new|không (?:còn )?nhận khách|khách hàng hiện có|ECS Express Mode'
    fact: 'AWS App Runner không nhận khách hàng mới (AWS công bố 2026-03-31) — container web ít vận hành: Amazon ECS Express Mode (Fargate + ALB + auto scaling)'
    since: '2026-03-31'
    url: 'https://docs.aws.amazon.com/apprunner/latest/dg/apprunner-availability-change.html · https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html'
