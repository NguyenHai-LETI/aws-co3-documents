    fact: 'Amazon QLDB đã ngừng hoạt động (hết hỗ trợ 2025-07-31) và không còn trong danh sách dịch vụ của đề — không được là đáp án'
    since: '2025-07-31'
    url: 'https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html'
  - id: timestream-liveanalytics-closed
    pattern: '(?:=|→|->)\s*(?:use\s+|dùng\s+)?(?:Amazon\s+)?Timestream\b(?!\s+for\s+InfluxDB)|\b(?:use|choose|recommend|dùng|chọn)\w*\s+(?:Amazon\s+)?Timestream\b(?!\s+for\s+InfluxDB)|Timestream for LiveAnalytics'
    unless: 'InfluxDB|no longer (?:open|available)|closed to new|không (?:còn )?nhận khách'
    fact: 'Amazon Timestream for LiveAnalytics (Timestream bản gốc) không nhận khách hàng mới từ 2025-06-20 — dữ liệu time-series mới: Amazon Timestream for InfluxDB'
    since: '2025-06-20'
    url: 'https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html · https://docs.aws.amazon.com/timestream/latest/developerguide/timestream-for-influxdb.html'
  # ── Analytics / media
  - id: kda-sql-discontinued
    pattern: '(?:Kinesis Data Analytics|\bKDA)\s+(?:for\s+)?SQL(?:\s+applications?)?\b|SQL applications?[^.\n]{0,30}(?:Kinesis Data Analytics|\bKDA\b)|Kinesis Data Analytics\s*\(\s*SQL\s*\)'
    unless: 'discontinu|đã ngừng|ngừng (?:hoạt động|hỗ trợ)|bị xoá'
    fact: 'Kinesis Data Analytics for SQL Applications đã ngừng (không tạo app mới từ 2025-10-15, app bị xoá từ 2026-01-27) — xử lý stream bằng SQL: Amazon Managed Service for Apache Flink (Studio)'
    since: '2026-01-27'
    url: 'https://docs.aws.amazon.com/kinesisanalytics/latest/dev/discontinuation.html'
  - id: opensearch-rename
    pattern: 'Amazon\s+(?:Elasticsearch|ES)\b(?:\s+Service)?|\bElasticsearch Service\b|\bAWS Elasticsearch\b'
    unless: 'OpenSearch'
    fact: 'Amazon Elasticsearch Service đã đổi tên thành Amazon OpenSearch Service'
    since: '2021-09-08'
    url: 'https://aws.amazon.com/blogs/aws/amazon-elasticsearch-service-is-now-amazon-opensearch-service-and-supports-opensearch-10/'
  - id: elastic-transcoder-shutdown
    pattern: 'Elastic Transcoder'
    unless: 'discontinu|đã ngừng|ngừng (?:hoạt động|hỗ trợ)|full shutdown'
    fact: 'Amazon Elastic Transcoder đã ngừng hẳn (2025-11-13); AWS chuyển sang AWS Elemental MediaConvert — dịch vụ ngoài phạm vi đề, nên không viết câu chuyển mã video mới'
    since: '2025-11-13'
    url: 'https://aws.amazon.com/blogs/media/support-for-amazon-elastic-transcoder-ending-soon/ · https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html'
  # ── Bảo mật / định danh
  - id: iam-identity-center-rename
    pattern: '\bAWS\s+(?:SSO|Single Sign-On)\b'
    unless: 'IAM Identity Center'
    fact: 'AWS Single Sign-On (AWS SSO) đã đổi tên thành AWS IAM Identity Center — tên dùng trong đề cương SAA-C03'
    since: '2022-07-26'
    url: 'https://aws.amazon.com/about-aws/whats-new/2022/07/aws-single-sign-on-aws-sso-now-aws-iam-identity-center/'
  - id: kms-rotation-period
    pattern: '(?:customer[- ]managed(?: KMS)? keys?|\bCMKs?\b)[^.\n]{0,80}(?:only|chỉ)[^.\n]{0,25}(?:once\s+(?:a|per|every)\s+year|every\s+(?:year|365 days)|annually|hằng năm|hàng năm|mỗi năm)|(?:customer[- ]managed(?: KMS)? keys?|\bCMKs?\b)[^.\n]{0,80}(?:cannot|can.t|can not|không thể)[^.\n]{0,30}(?:change|customi[sz]e|configure|set|đổi|tuỳ chỉnh|chỉnh)[^.\n]{0,30}rotation|(?:customer[- ]managed(?: KMS)? keys?|\bCMKs?\b)[^.\n]{0,60}rotation(?:\s+(?:period|frequency|schedule|interval))?[^.\n]{0,20}(?:cannot|can.t|can not|không thể)\s+(?:be\s+)?(?:changed|customi[sz]ed|configured|đổi|tuỳ chỉnh)|AWS[- ]managed\s+(?:KMS\s+)?keys?[^.\n]{0,60}(?:three|3)\s+years|(?:three|3)\s+years[^.\n]{0,40}AWS[- ]managed'
    unless: '\b90\b[^.\n]{0,20}2[.,]?560|on-demand rotation|RotateKeyOnDemand|xoay theo yêu cầu'
    fact: 'KMS: khoá customer managed xoay tự động theo chu kỳ tuỳ chọn 90–2.560 ngày (mặc định 365) và xoay theo yêu cầu được từ 2024-04-12; khoá AWS managed xoay mỗi năm (từ 5/2022, trước đó 3 năm)'
    since: '2024-04-12'
    url: 'https://aws.amazon.com/about-aws/whats-new/2024/04/aws-kms-automatic-key-rotation/ · https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html'
  - id: acm-exportable-public-certificates
    pattern: '(?:ACM|Certificate Manager)\s+(?:public\s+)?(?:SSL/TLS\s+|TLS\s+)?certificates?[^.\n]{0,60}(?:cannot|can.t|can not|không thể|không)\s+(?:be\s+)?(?:export\w*|install\w*|used?\s+(?:directly\s+)?(?:on|with|trên)\s+(?:EC2|(?:the\s+)?instances?|on-prem\w*|máy chủ)|xuất|cài)|(?:cannot|can.t|can not|không thể)\s+(?:export|install|xuất|cài)[^.\n]{0,40}(?:ACM|Certificate Manager)\s+(?:public\s+)?certificates?'
    unless: 'exportable|export(?:ed|able)? public|xuất được'
    fact: 'ACM cấp chứng chỉ public "exportable" (trả phí) dùng được trên EC2 / container / on-premises từ 2025-06-17 — "chứng chỉ ACM không cài được lên EC2" không còn tuyệt đối (chứng chỉ cấp trước ngày này vẫn không xuất được)'
    since: '2025-06-17'
    url: 'https://aws.amazon.com/about-aws/whats-new/2025/06/aws-certificate-manager-public-certificates-use-anywhere/'
  - id: simple-ad-closed
    pattern: '(?:=|→|->)\s*(?:AWS\s+)?(?:Directory Service\s+)?Simple AD\b|\b(?:use|choose|deploy|create|recommend|dùng|chọn)\w*\s+(?:an?\s+|the\s+)?(?:AWS\s+)?(?:Directory Service\s+)?\(?\s*Simple AD\b|Simple AD\b[^.\n]{0,40}\b(?:is|are|=)\s+(?:the\s+)?(?:best|cheapest|right|recommended|most cost-effective|lowest[- ]cost|rẻ nhất)'
    unless: '(?:only|chỉ)[^.\n]{0,30}existing customers|closed to new|no longer (?:open|available)|không (?:còn )?nhận khách|khách hàng hiện có|new customer onboarding'
    fact: 'AWS Directory Service Simple AD không nhận khách hàng mới (AWS công bố 2026-06-30) — thiết kế mới: AWS Managed Microsoft AD hoặc AD Connector'
    since: '2026-06-30'
    url: 'https://docs.aws.amazon.com/directoryservice/latest/admin-guide/simple-ad-availability-change.html · https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html'
  - id: audit-manager-maintenance
    pattern: 'Audit Manager'
    unless: 'maintenance mode|chế độ bảo trì|no longer (?:open|available)|không (?:còn )?nhận khách'
    fact: 'AWS Audit Manager chuyển chế độ bảo trì: từ 2026-04-30 không thiết lập được cho tài khoản mới, đã bị gỡ khỏi phạm vi đề — AWS gợi ý AWS Config Conformance Packs'
    since: '2026-04-30'
    url: 'https://docs.aws.amazon.com/audit-manager/latest/userguide/audit-manager-availability-change.html'
  # ── Quản trị / di chuyển
  - id: cloudtrail-lake-closed
    pattern: 'CloudTrail Lake'
    unless: 'no longer (?:open|available)|closed to new|không (?:còn )?nhận khách|khách hàng hiện có'
    fact: 'AWS CloudTrail Lake không nhận khách hàng mới từ 2026-05-31 (trail CloudTrail vẫn bình thường) — AWS gợi ý Amazon CloudWatch để lưu và phân tích log kiểm toán'
