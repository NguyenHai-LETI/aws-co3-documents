  - id: "06-v2-21"
    base: "a731c3d860"
    reason: "Blind solve: no option was correct (an earlier patch replaced the automatic-rollback option). CloudFormation rolls back a failed stack update by default — https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html"
    options:
      A: "StackSets to push the update to other accounts automatically"
      B: "Termination protection to block deletion of the stack"
      C: "Automatic rollback that restores the previous stack configuration"
      D: "Drift detection to review manual configuration changes"
    explanation: |
      When a stack update fails, CloudFormation rolls back by default: every changed resource returns to its previous stable configuration (UPDATE_ROLLBACK_COMPLETE), and rollback triggers can start the same rollback from CloudWatch alarms. https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html
      - StackSets: deploy one template across accounts and Regions; they do not undo a failed update.
      - Termination protection: prevents a stack from being deleted, not an update from failing.
      - Drift detection: reports changes made outside CloudFormation; it restores nothing.
      > 🇻🇳 Cập nhật stack lỗi giữa chừng → CloudFormation tự rollback về cấu hình ổn định trước đó (mặc định).
  - id: "13-v2-11"
    base: "cabbd76d72"
    reason: "Blind solve: Local Zones does not keep data on premises, so the old pair was not defensible. Stem now states both needs (on-premises residency → Outposts; metro far from a Region → Local Zones) — https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html · https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html"
    stem: |
      A company must keep a regulated workload and its data inside its own data center while using the same AWS APIs and tools as in the Region. It also runs latency-sensitive game servers that need single-digit millisecond latency for players in a large city far from any AWS Region. Which TWO services should a solutions architect use? (Choose TWO)
    options:
      A: "AWS Local Zones close to the end users for the game servers"
      B: "AWS Outposts racks installed on premises for the compliance workload"
      C: "Amazon CloudFront in front of the game servers in the Region"
      D: "AWS Direct Connect from the data center to the nearest Region"
      E: "AWS Global Accelerator in front of the game servers in the Region"
    explanation: |
      Outposts racks run AWS infrastructure and APIs inside the company's data center, so regulated data never leaves the premises, and Local Zones place compute in a large metro area far from a Region, giving nearby players single-digit millisecond latency.
      - CloudFront: caches content at the edge; the game servers still run in the distant Region.
      - Direct Connect: a private link to the Region; the regulated workload would then run outside the data center.
      - Global Accelerator: optimizes the path to Regional endpoints but cannot remove the distance to the Region.
      > 🇻🇳 Dữ liệu phải nằm on-prem → Outposts; người chơi ở đô thị xa Region cần độ trễ vài ms → Local Zones.
  - id: "16-v2-24"
    base: "aa3814f14b"
    stem: |
      An ingestion job writes objects to S3 and immediately transitions them to Glacier, but small objects incur high per-object and minimum-duration charges. Which two considerations apply? (Choose TWO)
    set: { services: [S3 Glacier, S3] }
    explanation: |
      S3 Standard-IA and the Glacier storage classes bill a minimum storage duration (30, 90 or 180 days) and per-object overhead (a minimum billable size for IA, extra metadata for each archived object), so very small or short-lived objects are often cheaper left in S3 Standard.
      - One Zone-IA has no minimum duration: false, it also bills at least 30 days.
      - Lifecycle transitions are free of minimums: transitions are charged per request and the target class minimums still apply.
      - Glacier is always cheapest: false for tiny or short-lived objects.
      > 🇻🇳 Object nhỏ/ngắn hạn đưa sang IA/Glacier bị tính thời gian tối thiểu + overhead → để ở S3 Standard rẻ hơn.
  - id: "17-v1-10"
    base: "9ecba288e2"
    reason: "S3 Object Lambda accepts only existing customers since 2025-11-07; AWS recommends Lambda invoked through API Gateway / CloudFront / function URLs to transform objects on read — https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html"
    stem: |
      A company must return objects from Amazon S3 with PII redacted on the fly when they are retrieved, using AWS Lambda and without storing redacted copies. Which design meets this requirement?
    options:
      A: "S3 Cross-Region Replication that copies each object to a redacted bucket"
      B: "Amazon API Gateway calling a Lambda function that redacts each object on read"
      C: "S3 Inventory report that lists every object containing PII for review"
      D: "S3 Batch Operations job that writes a redacted copy of every object"
    explanation: |
      Routing reads through API Gateway to a Lambda function lets the function fetch the object from S3, redact PII and return the result per request, so no redacted copies are stored. This is the pattern AWS recommends now that S3 Object Lambda accepts only existing customers (since 2025-11-07): https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html
      - Cross-Region Replication: copies objects unchanged and stores a second copy.
      - S3 Inventory: lists objects and metadata; it transforms nothing.
      - S3 Batch Operations: processes objects in bulk ahead of time and stores the results.
      > 🇻🇳 Che PII khi đọc, không lưu bản sao → Lambda gọi qua API Gateway (S3 Object Lambda chỉ còn cho khách hàng hiện có).
  - id: "17-v2-10"
    base: "79e48dfc75"
    reason: "S3 Object Lambda accepts only existing customers since 2025-11-07; AWS recommends Lambda invoked through API Gateway / CloudFront / function URLs to transform objects on read — https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html"
    stem: |
      Objects in Amazon S3 must be transformed (for example, PII redacted) as they are retrieved via a GET request, without changing the stored object. Which design meets this requirement?
    options:
      A: "Byte-range fetch that skips the sensitive part of each object"
      B: "S3 Batch Operations job that redacts every object in place"
      C: "Lambda function URL that fetches the object and returns a redacted version"
      D: "S3 Lifecycle rule that transitions objects to a cheaper storage class"
    explanation: |
      A Lambda function URL (or API Gateway, or CloudFront in front of Lambda) receives the GET, reads the object from S3, redacts it and returns the result, leaving the stored object untouched. This is AWS's recommended replacement now that S3 Object Lambda accepts only existing customers (since 2025-11-07): https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html
      - Byte-range fetch that skips the sensitive part: returns raw bytes only, and PII is mixed into the content, so nothing is actually redacted.
      - S3 Batch Operations redacting in place: changes the stored object, which is not allowed.
      - S3 Lifecycle rule: transitions or expires objects; it never transforms content.
      > 🇻🇳 Biến đổi dữ liệu khi GET mà không sửa object gốc → Lambda (function URL / API Gateway) đọc S3 rồi trả bản đã che.

  # ── Stale distractor replaced (closed / shut-down service) + explanation ──
  - id: "02-v1-12"
    base: "cc3052486a"
    options: { C: "S3 Requester Pays" }
    explanation: |
      S3 Transfer Acceleration routes uploads through the nearest CloudFront edge location and then over the AWS backbone to the bucket, which speeds up long-distance transfers of large files into a single bucket.
      - Byte-range fetches: parallelize downloads (GET), not uploads.
      - S3 Requester Pays: changes who pays for requests and data transfer, not speed.
      - S3 Cross-Region Replication: copies objects after the upload; it does not make the upload faster.
      > 🇻🇳 Người dùng toàn cầu upload chậm vào một bucket → S3 Transfer Acceleration (edge + backbone AWS).
  - id: "02-v2-15"
    base: "7ca0833f1a"
    options: { A: "S3 Requester Pays bucket setting" }
    explanation: |
      S3 Transfer Acceleration sends uploads to the nearest CloudFront edge location and then across the AWS backbone to the bucket, which helps most when global users upload large files to one bucket.
      - S3 Requester Pays: changes who pays for requests and data transfer, not speed.
      - Byte-range fetches: parallelize downloads, not uploads.
      - S3 Inventory: lists objects and metadata on a schedule.
      > 🇻🇳 Upload toàn cầu chậm vào một bucket → S3 Transfer Acceleration.
  - id: "15-v1-08"
    base: "7e3d66a558"
    options: { A: "S3 Intelligent-Tiering" }
    explanation: |
      S3 Versioning keeps every version of an object, so an overwritten or deleted object can be restored from a previous version; MFA Delete additionally requires MFA to permanently delete versions or change the versioning state.
      - S3 Intelligent-Tiering: moves objects between access tiers to save cost; no protection from deletion.
      - Requester Pays: shifts request and transfer charges to the requester.
      - S3 Transfer Acceleration: speeds up long-distance uploads.
      > 🇻🇳 Chống xoá nhầm, khôi phục phiên bản cũ → S3 Versioning (+ MFA Delete).
  - id: "09-v1-04"
    base: "df6eb434fa"
    options: { D: "AWS Step Functions" }
    explanation: |
      AWS Glue is serverless ETL: crawlers infer schemas into the Glue Data Catalog, and Glue jobs (Spark or Python) transform the data for analytics.
      - Amazon Athena: queries data that is already cataloged; it does not crawl sources or run ETL jobs.
      - Amazon Kinesis: ingests streaming data; no crawler or catalog.
      - AWS Step Functions: orchestrates workflow steps (it can call Glue jobs) but does not infer schemas or transform data itself.
      > 🇻🇳 ETL serverless + crawler + Data Catalog → AWS Glue.
  - id: "05-v2-10"
    base: "a69e34f08e"
    options: { B: "IAM Identity Center (AWS SSO) only" }
    explanation: |
      Cognito user pools provide a managed user directory with sign-up and sign-in, federation with social identity providers such as Google and Facebook, and JWT tokens for the mobile app.
      - IAM Identity Center (formerly AWS SSO): workforce single sign-on to AWS accounts and business apps, not end-user sign-up for a consumer app.
      - IAM users: long-term credentials inside your AWS account, not built for millions of app users.
      - AWS Directory Service: managed Microsoft AD for enterprise workloads, no social federation.
      > 🇻🇳 Đăng ký/đăng nhập người dùng app + federation Google/Facebook + token → Cognito User Pools (IAM Identity Center dành cho nhân viên).
  - id: "07-v1-03"
    base: "e6b677c12c"
    options: { C: "S3 → Amazon Data Firehose" }
    explanation: |
      Publishing the S3 event notification to an SNS topic that fans out to three SQS queues gives each pipeline its own durable copy of every event, so the pipelines process in parallel and independently.
      - S3 → single SQS queue: consumers compete for the same messages, so each event reaches only one pipeline.
      - S3 → Amazon Data Firehose (formerly Kinesis Data Firehose): not an S3 event notification target, and it delivers to storage/analytics destinations rather than three processors.
      - S3 → Lambda only: one function per event; the other pipelines would need custom fan-out code.
      > 🇻🇳 Một sự kiện, nhiều pipeline xử lý song song → fan-out S3 → SNS → nhiều SQS.
  - id: "08-v2-03"
    base: "a43c0253c4"
    options: { B: "Amazon ECR" }
    explanation: |
      CodeCommit hosts private Git repositories managed by AWS, with access controlled through IAM policies and credentials. It returned to general availability for new customers on 2025-11-24 but is outside the SAA-C03 service list.
      - CodeGuru: reviews code and profiles performance; it does not host repositories.
      - Amazon ECR: private registry for container images, not Git source code.
      - CodeArtifact: stores build packages (npm, Maven, PyPI), not Git history.
      > 🇻🇳 Git riêng tư do AWS quản lý, phân quyền bằng IAM → CodeCommit.
  - id: "08-v2-08"
    base: "16943911d8"
    options: { B: "AWS SAM" }
    explanation: |
      The AWS CDK lets teams define infrastructure in TypeScript, Python, Java and other languages; synthesizing the app produces CloudFormation templates that deploy as stacks.
      - AWS SAM: shorthand YAML/JSON templates for serverless resources, not general-purpose programming languages.
      - CodeBuild: runs builds and tests; it does not define infrastructure.
      - CodePipeline: orchestrates release stages; it does not model resources.
      > 🇻🇳 Viết hạ tầng bằng ngôn ngữ lập trình quen thuộc rồi sinh CloudFormation → AWS CDK.
  - id: "10-v1-05"
    base: "3ed003f70e"
    options: { C: "Amazon S3 File Gateway" }
    explanation: |
      DataSync connects to the on-premises NFS share through an agent and runs scheduled, incremental, verified transfers directly into Amazon EFS.
      - AWS Transfer Family: managed SFTP/FTPS/FTP endpoints for partners, not NFS-to-EFS sync.
      - Amazon S3 File Gateway: presents S3 storage to on-premises clients; it does not write into EFS.
      - AWS Backup: backs up AWS resources; it does not migrate on-premises file shares.
      > 🇻🇳 Đồng bộ NFS on-prem → EFS theo lịch, incremental → AWS DataSync.
  - id: "10-v2-04"
    base: "f4816164a6"
    options: { B: "S3 Transfer Acceleration" }
    explanation: |
      AWS Transfer Family provides a fully managed SFTP endpoint that stores uploaded files directly in Amazon S3, so partners keep using their existing SFTP clients.
      - S3 Transfer Acceleration: speeds up HTTPS uploads to S3; it offers no SFTP endpoint.
      - AWS DataSync: moves data from storage you run; partners cannot push files to it over SFTP.
      - Storage Gateway: on-premises hybrid storage access, not an internet-facing SFTP service.
      > 🇻🇳 Đối tác upload qua SFTP, lưu vào S3 → AWS Transfer Family.
  - id: "11-v1-10"
    base: "948402e109"
    options: { B: "AWS End User Messaging SMS only" }
    explanation: |
      Amazon SES is a scalable, pay-as-you-go email service built for high-volume transactional and marketing email such as receipts.
      - AWS End User Messaging SMS: sends SMS and voice messages, not email.
      - Amazon Connect: cloud contact center, not bulk email.
      - Amazon SNS: pub/sub notifications; its email protocol suits plain alerts to subscribers, not branded transactional email at scale.
      > 🇻🇳 Gửi email giao dịch số lượng lớn, rẻ → Amazon SES.
  - id: "11-v2-03"
    base: "4b8890f1df"
    options: { C: "AWS End User Messaging only" }
    explanation: |
      Amazon SES sends transactional and marketing email at scale with high deliverability, pay-as-you-go pricing and no mail servers to run.
      - API Gateway: exposes APIs; it does not send email.
      - AWS End User Messaging: SMS, voice and push channels, not email.
      - Amazon SNS: pub/sub notifications to subscribers, not full transactional or marketing email.
      > 🇻🇳 Email giao dịch + marketing quy mô lớn → Amazon SES.
  - id: "12-v1-03"
    base: "d706931e89"
    options: { D: "Amazon Translate" }
    explanation: |
      Amazon Transcribe uses automatic speech recognition to convert speech in audio files or streams into text, such as call-center transcripts.
      - Amazon Polly: the reverse direction, text to speech.
      - Amazon Comprehend: analyzes existing text (sentiment, entities); it does not transcribe audio.
      - Amazon Translate: translates text between languages; it needs text input.
      > 🇻🇳 Giọng nói → văn bản → Amazon Transcribe (Polly là chiều ngược lại).
  - id: "12-v1-16"
    base: "4cd0f4319c"
    options: { A: "Amazon Comprehend" }
    explanation: |
      Amazon Transcribe streaming converts live audio to text in real time, which is what automatic captions require.
      - Amazon Comprehend: analyzes text that already exists; it does not convert speech.
      - Amazon Polly: text to speech, the opposite direction.
      - Amazon Translate: translates text between languages; it needs text input first.
      > 🇻🇳 Phụ đề real-time từ âm thanh → Amazon Transcribe (streaming).
  - id: "12-v1-20"
    base: "98eed2f5f3"
    options: { A: "Amazon Rekognition + Amazon Textract", D: "Amazon Lex + Amazon Polly" }
    explanation: |
      Amazon Transcribe converts the call audio to text (and can redact PII in transcripts), and Amazon Comprehend detects sentiment and PII entities in that text.
      - Rekognition + Textract: analyze images, video and scanned documents, not call audio.
      - Polly + Translate: synthesize speech and translate text; no transcription or sentiment analysis.
      - Lex + Polly: build voice chatbots; they do not analyze recorded calls.
      > 🇻🇳 Cuộc gọi → văn bản → phân tích cảm xúc/PII → Transcribe + Comprehend.
  - id: "12-v2-06"
    base: "37d18b1889"
    options: { A: "Amazon Translate" }
    explanation: |
      Amazon Comprehend is the managed NLP service that detects sentiment, key phrases, entities and language in text such as customer feedback.
      - Amazon Translate: converts text between languages; no sentiment analysis.
      - Amazon Personalize: product recommendations from interaction data.
      - Amazon Rekognition: analyzes images and video, not text.
      > 🇻🇳 Phân tích cảm xúc, cụm từ khoá trong văn bản → Amazon Comprehend.
  - id: "12-v2-13"
    base: "84dfd49dc7"
    options: { B: "Amazon Rekognition" }
    explanation: |
      Amazon Bedrock gives access to foundation models from Amazon and other providers through one managed API, so teams build generative AI applications without managing infrastructure.
      - Amazon Rekognition: pre-trained image and video analysis, not generative AI.
      - Amazon Comprehend: pre-trained NLP analysis such as sentiment.
      - SageMaker Ground Truth (part of Amazon SageMaker AI): labels training data with human workers.
      > 🇻🇳 Ứng dụng generative AI dùng foundation model qua API → Amazon Bedrock.
  - id: "12-v1-08"
    base: "56d3006c75"
    options: { C: "Amazon Lex", D: "Build a custom personalization model on Amazon SageMaker AI" }
    explanation: |
      Amazon Personalize is a managed recommendation service: it trains on your interaction data and serves real-time recommendations through an API without in-house ML development.
      - Amazon Comprehend: NLP on text, no recommendations.
      - Amazon Lex: builds conversational chatbots.
      - Custom model on SageMaker AI: possible, but you build, train and operate it yourself, which the scenario wants to avoid.
