  # ── Explanation-only: status of retired / closed services in distractors or Snow Family keys ──
  - id: "02-v1-08"
    base: "e2f7af2be0"
    explanation: |
      At 200 Mbps the link moves only about 2 TB per day, so 600 TB would take roughly nine months online; Snowball Edge Storage Optimized devices ship the data offline within two weeks.
      - DataSync over the internet: still capped by the 200 Mbps link.
      - S3 Transfer Acceleration: optimizes the network path but cannot exceed the link bandwidth.
      - Storage Gateway: hybrid access that uploads over the same slow link.
      Status: Snowball Edge is available only to existing customers since 2025-11-07 and device support ends 2026-12-31; new designs use DataSync over Direct Connect or AWS Data Transfer Terminal (https://docs.aws.amazon.com/snowball/latest/developer-guide/snowball-edge-availability-change.html).
      > 🇻🇳 Dữ liệu lớn + băng thông thấp + hạn gấp → thiết bị offline Snowball Edge (đề cương vẫn có Snow Family; thực tế chỉ còn cho khách hàng hiện có từ 2025-11-07, ngừng hỗ trợ 2026-12-31).
  - id: "02-v2-12"
    base: "ae44fa00ba"
    explanation: |
      With limited bandwidth and a tight deadline, 500 TB cannot be uploaded in time; Snowball Edge devices move the data offline and import it into S3.
      - Direct upload via CLI: limited by the same slow link.
      - DataSync over the internet: automates the transfer but cannot exceed the available bandwidth.
      - S3 Transfer Acceleration: optimizes the path, not the link capacity.
      Status: Snowball Edge is available only to existing customers since 2025-11-07 and device support ends 2026-12-31; new designs use DataSync over Direct Connect or AWS Data Transfer Terminal (https://docs.aws.amazon.com/snowball/latest/developer-guide/snowball-edge-availability-change.html).
      > 🇻🇳 Hàng trăm TB + băng thông hạn chế + hạn gấp → Snowball Edge (chỉ còn cho khách hàng hiện có, ngừng hỗ trợ 2026-12-31).
  - id: "10-v1-03"
    base: "426a1de01d"
    explanation: |
      With limited bandwidth and a tight deadline, shipping 80 TB on a Snowball Edge device is faster than pushing it over the network.
      - AWS DataSync: online transfer, still limited by the slow link.
      - S3 Transfer Acceleration: optimizes the path, not the link capacity.
      - AWS Storage Gateway: hybrid access that uploads over the same link.
      Status: Snowball Edge is available only to existing customers since 2025-11-07 and device support ends 2026-12-31; new designs use DataSync over Direct Connect or AWS Data Transfer Terminal (https://docs.aws.amazon.com/snowball/latest/developer-guide/snowball-edge-availability-change.html).
      > 🇻🇳 Băng thông thấp + hạn gấp → chuyển offline bằng Snowball Edge (chỉ còn cho khách hàng hiện có, ngừng hỗ trợ 2026-12-31).
  - id: "10-v2-03"
    base: "3a99cd8cd1"
    explanation: |
      200 TB over a limited-bandwidth link cannot meet a tight deadline; Snowball Edge devices move the data offline and import it into S3.
      - DataSync over the internet: still limited by the slow link.
      - AWS Transfer Family: SFTP/FTP endpoints for file exchange, not bulk migration.
      - Direct upload via CLI: same bandwidth limit, plus manual retries.
      Status: Snowball Edge is available only to existing customers since 2025-11-07 and device support ends 2026-12-31; new designs use DataSync over Direct Connect or AWS Data Transfer Terminal (https://docs.aws.amazon.com/snowball/latest/developer-guide/snowball-edge-availability-change.html).
      > 🇻🇳 200 TB + băng thông hạn chế + hạn gấp → Snowball Edge (chỉ còn cho khách hàng hiện có, ngừng hỗ trợ 2026-12-31).
  - id: "10-v1-13"
    base: "0fcbe4a0eb"
    explanation: |
      An offline Snowball Edge device makes sense when moving the data over the available network would take weeks; otherwise DataSync over the network is simpler and continuous.
      - The data is already in AWS: there is nothing to import.
      - Small dataset and high bandwidth: a network transfer finishes faster than shipping a device.
      - Real-time continuous replication: needs an online service such as DataSync or DMS, not a shipped device.
      Status: Snowball Edge is available only to existing customers since 2025-11-07 and device support ends 2026-12-31; new large transfers use DataSync over Direct Connect or AWS Data Transfer Terminal.
      > 🇻🇳 Chọn thiết bị offline khi truyền qua mạng mất hàng tuần (Snowball Edge chỉ còn cho khách hàng hiện có, ngừng hỗ trợ 2026-12-31).
  - id: "14-v1-16"
    base: "47c201665d"
    explanation: |
      DataSync performs online, automated, incremental transfers over the network, while a Snowball device is the offline option when bandwidth is too limited.
      - Snowball vs DataSync: the right services in the reverse order.
      - Transfer Family vs Snowball: Transfer Family offers SFTP/FTPS endpoints for partners, not incremental sync.
      - Storage Gateway vs DataSync: Storage Gateway is hybrid storage access, and DataSync is online, not offline.
      Status: Snowball Edge is available only to existing customers since 2025-11-07 (device support ends 2026-12-31).
      > 🇻🇳 Online, incremental → DataSync; thiết bị offline → Snowball (chỉ còn cho khách hàng hiện có).
  - id: "02-v1-19"
    base: "82c3582f9e"
    explanation: |
      DataSync runs scheduled, incremental transfers from on-premises NFS/SMB/HDFS storage to S3, EFS or FSx, and Storage Gateway continuously moves on-premises data into AWS storage while keeping a local cache.
      - Amazon S3 Transfer Acceleration: speeds up individual uploads but has no scheduling or incremental sync.
      - Amazon Macie: discovers sensitive data in S3; it does not transfer data.
      - AWS Snowmobile: retired (full shutdown in 2024); it was a one-time offline exabyte transport, never a scheduled sync.
      > 🇻🇳 Chuyển dữ liệu tự động, theo lịch, incremental từ on-prem → DataSync + Storage Gateway (Snowmobile đã ngừng hẳn).
  - id: "10-v1-04"
    base: "2d2412c3cd"
    explanation: |
      Application Migration Service (MGN) installs a replication agent that continuously copies block-level data from physical and virtual servers to AWS, then launches EC2 instances at cutover with minimal downtime.
      - AWS Snowmobile: retired (full shutdown in 2024); it only moved data offline, never running servers.
      - AWS DMS: migrates databases, not whole servers.
      - AWS DataSync: copies files and objects, not bootable server volumes.
      > 🇻🇳 Lift-and-shift hàng trăm server, sao chép block liên tục, downtime thấp → Application Migration Service (MGN).
  - id: "10-v1-18"
    base: "7101bd4242"
    explanation: |
      Storage Gateway (File Gateway, or Volume Gateway in cached mode) keeps frequently used data in a local cache for low-latency access while continuously storing the full data set in AWS.
      - AWS Transfer Family: SFTP/FTP endpoints into S3 or EFS, with no local cache.
      - AWS Snowmobile: retired (full shutdown in 2024), and only ever a one-time offline transfer.
      - AWS DMS: replicates databases, not file shares.
      > 🇻🇳 File share on-prem cần cache cục bộ + lưu trên AWS → Storage Gateway (File/Volume Gateway).
  - id: "10-v1-20"
    base: "e98bbf1b01"
    explanation: |
      Application Migration Service (MGN) rehosts VMware VMs by continuously replicating them to AWS and launching them as EC2 instances, so applications move without refactoring and cutover can be tested first.
      - Snowmobile: retired (full shutdown in 2024); it only moved data offline.
      - AWS Glue ETL: transforms data; it does not migrate servers.
      - Rebuild every app manually on EC2: maximum effort and cutover risk.
      > 🇻🇳 Di chuyển VMware quy mô lớn, ít sửa ứng dụng → Application Migration Service (lift-and-shift).
  - id: "10-v2-10"
    base: "c372830cb5"
    explanation: |
      AWS DMS performs a homogeneous Oracle-to-RDS-for-Oracle migration with a full load followed by change data capture (CDC), keeping the source live until a short cutover.
      - DataSync: copies files and objects, not live database changes.
      - Snowmobile: retired (full shutdown in 2024); an offline transfer could not keep changes in sync anyway.
      - Storage Gateway: hybrid file/volume/tape storage, not database replication.
      > 🇻🇳 Oracle → RDS Oracle, downtime thấp → AWS DMS (full load + CDC).
  - id: "13-v1-08"
    base: "37f307083f"
    explanation: |
      AWS Ground Station is a managed network of antennas: teams schedule satellite contacts and downlink data directly into AWS without building ground stations.
      - AWS Snowmobile: retired (full shutdown in 2024), and it was a truck for offline data transfer.
      - AWS IoT Core: connects IoT devices over MQTT, not satellites.
      - AWS Outposts: AWS infrastructure on premises, with no satellite antennas.
      > 🇻🇳 Điều khiển/tải dữ liệu vệ tinh mà không cần trạm mặt đất riêng → AWS Ground Station.
  - id: "10-v2-14"
    base: "02c90542de"
    explanation: |
      Migration Evaluator analyzes on-premises utilization data and produces a business case with projected AWS costs before any migration starts.
      - AWS Migration Hub: tracks migration progress and is no longer open to new customers (since 2025-11-07); it does not build cost estimates.
      - AWS DMS: replicates databases during the migration, not pre-migration cost analysis.
      - Compute Optimizer: right-sizes resources that already run in AWS.
      > 🇻🇳 Ước tính chi phí chạy workload on-prem trên AWS trước khi di chuyển → Migration Evaluator.
  - id: "06-v1-01"
    base: "fb3cbb5bac"
    explanation: |
      CloudFormation provisions infrastructure from declarative templates that can be kept in version control and deployed repeatedly as stacks (or StackSets) in any Region.
      - AWS OpsWorks: Chef/Puppet configuration management, discontinued in 2024 (full shutdown), and never a template-based provisioning service.
      - AWS Systems Manager: operates and patches existing resources; it does not model whole environments as templates.
      - AWS Config: records and evaluates resource configuration; it does not create resources.
      > 🇻🇳 Hạ tầng dạng code, lặp lại được giữa các Region → CloudFormation (OpsWorks đã ngừng hẳn năm 2024).
  - id: "06-v2-01"
    base: "be37778749"
    explanation: |
      CloudFormation models whole environments (VPC, EC2, RDS) as code in templates and deploys them repeatedly as stacks, or across Regions with StackSets.
      - AWS Config: records and evaluates resource configuration; it does not provision.
      - AWS OpsWorks: Chef/Puppet configuration management, discontinued in 2024 (full shutdown).
      - AWS Systems Manager: operates existing resources; it does not define environments as templates.
      > 🇻🇳 Dựng cả môi trường bằng code, lặp lại giữa các Region → AWS CloudFormation (OpsWorks đã ngừng hẳn).
  - id: "08-v1-13"
    base: "7bd2561e1f"
    explanation: |
      AWS SAM extends CloudFormation with a shorthand syntax for functions, APIs and tables; the SAM transform expands the template into a full CloudFormation stack during deployment.
      - AWS CodeArtifact: stores software packages; it does not define infrastructure.
      - AWS OpsWorks: Chef/Puppet configuration management, discontinued in 2024 (full shutdown).
      - AWS CodeDeploy: shifts traffic to new code versions but does not define serverless resources.
      > 🇻🇳 Template rút gọn cho serverless, chuyển thành CloudFormation → AWS SAM (OpsWorks đã ngừng hẳn).
