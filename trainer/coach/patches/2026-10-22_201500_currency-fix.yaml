  - id: "06-v2-21"
    base: "a731c3d860"
    reason: "Blind solve: no option was correct (an earlier patch replaced the automatic-rollback option). CloudFormation rolls back a failed stack update by default — https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html"
    options:
      A: "StackSets to push the update to other accounts automatically"
      B: "Termination protection to block deletion of the stack"
      C: "Automatic rollback that restores the previous stack configuration"
      D: "Drift detection to review manual configuration changes"
    explanation: |
      When a stack update fails, CloudFormation rolls back by default: every changed resource returns to its previous stable configuration (UPDATE_ROLLBACK_COMPLETE), and rollback triggers can start the same rollback from CloudWatch alarms. https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-failure-options.html
      - StackSets: deploy one template across accounts and Regions; they do not undo a failed update.
      - Termination protection: prevents a stack from being deleted, not an update from failing.
      - Drift detection: reports changes made outside CloudFormation; it restores nothing.
      > 🇻🇳 Cập nhật stack lỗi giữa chừng → CloudFormation tự rollback về cấu hình ổn định trước đó (mặc định).
  - id: "13-v2-11"
    base: "cabbd76d72"
    reason: "Blind solve: Local Zones does not keep data on premises, so the old pair was not defensible. Stem now states both needs (on-premises residency → Outposts; metro far from a Region → Local Zones) — https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html · https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html"
    stem: |
      A company must keep a regulated workload and its data inside its own data center while using the same AWS APIs and tools as in the Region. It also runs latency-sensitive game servers that need single-digit millisecond latency for players in a large city far from any AWS Region. Which TWO services should a solutions architect use? (Choose TWO)
    options:
      A: "AWS Local Zones in the players' metro area for the game servers"
      B: "AWS Outposts racks in the company's data center for the regulated workload"
      C: "Amazon CloudFront in front of the game servers in the Region"
      D: "AWS Direct Connect from the data center to the nearest Region"
      E: "AWS Global Accelerator in front of the game servers in the Region"
    explanation: |
      Outposts racks run AWS infrastructure and APIs inside the company's data center, so regulated data never leaves the premises, and Local Zones place compute in a large metro area far from a Region, giving nearby players single-digit millisecond latency.
      - CloudFront: caches content at the edge; the game servers still run in the distant Region.
      - Direct Connect: a private link to the Region; the regulated workload would then run outside the data center.
      - Global Accelerator: optimizes the path to Regional endpoints but cannot remove the distance to the Region.
      > 🇻🇳 Dữ liệu phải nằm on-prem → Outposts; người chơi ở đô thị xa Region cần độ trễ vài ms → Local Zones.
  - id: "16-v2-24"
    base: "aa3814f14b"
    stem: |
      An ingestion job writes objects to S3 and immediately transitions them to Glacier, but small objects incur high per-object and minimum-duration charges. Which two considerations apply? (Choose TWO)
    set: { services: [S3 Glacier, S3] }
    explanation: |
      S3 Standard-IA and the Glacier storage classes bill a minimum storage duration (30, 90 or 180 days) and per-object overhead (a minimum billable size for IA, extra metadata for each archived object), so very small or short-lived objects are often cheaper left in S3 Standard.
      - One Zone-IA has no minimum duration: false, it also bills at least 30 days.
      - Lifecycle transitions are free of minimums: transitions are charged per request and the target class minimums still apply.
      - Glacier is always cheapest: false for tiny or short-lived objects.
      > 🇻🇳 Object nhỏ/ngắn hạn đưa sang IA/Glacier bị tính thời gian tối thiểu + overhead → để ở S3 Standard rẻ hơn.
  - id: "17-v1-10"
    base: "9ecba288e2"
    reason: "S3 Object Lambda accepts only existing customers since 2025-11-07; AWS recommends Lambda invoked through API Gateway / CloudFront / function URLs to transform objects on read — https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html"
    stem: |
      A company must return objects from Amazon S3 with PII redacted on the fly when they are retrieved, using AWS Lambda and without storing redacted copies. Which design meets this requirement?
    options:
      A: "S3 Cross-Region Replication that copies each object to a redacted bucket"
      B: "Amazon API Gateway calling a Lambda function that redacts each object on read"
      C: "S3 Inventory report that lists every object containing PII for review"
      D: "S3 Batch Operations job that writes a redacted copy of every object"
    explanation: |
      Routing reads through API Gateway to a Lambda function lets the function fetch the object from S3, redact PII and return the result per request, so no redacted copies are stored. This is the pattern AWS recommends now that S3 Object Lambda accepts only existing customers (since 2025-11-07): https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html
      - Cross-Region Replication: copies objects unchanged and stores a second copy.
      - S3 Inventory: lists objects and metadata; it transforms nothing.
      - S3 Batch Operations: processes objects in bulk ahead of time and stores the results.
      > 🇻🇳 Che PII khi đọc, không lưu bản sao → Lambda gọi qua API Gateway (S3 Object Lambda chỉ còn cho khách hàng hiện có).
  - id: "17-v2-10"
    base: "79e48dfc75"
    reason: "S3 Object Lambda accepts only existing customers since 2025-11-07; AWS recommends Lambda invoked through API Gateway / CloudFront / function URLs to transform objects on read — https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html"
    stem: |
      Objects in Amazon S3 must be transformed (for example, PII redacted) as they are retrieved via a GET request, without changing the stored object. Which design meets this requirement?
    options:
      A: "Byte-range fetch of only the non-sensitive part of each object"
      B: "S3 Batch Operations job that redacts every object in place"
      C: "Lambda function URL that fetches the object and returns a redacted version"
      D: "S3 Lifecycle rule that transitions objects to a cheaper storage class"
    explanation: |
      A Lambda function URL (or API Gateway, or CloudFront in front of Lambda) receives the GET, reads the object from S3, redacts it and returns the result, leaving the stored object untouched. This is AWS's recommended replacement now that S3 Object Lambda accepts only existing customers (since 2025-11-07): https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazons3-ol-change.html
      - Byte-range fetch: returns raw bytes of a range; sensitive data inside it is not redacted.
      - S3 Batch Operations redacting in place: changes the stored object, which is not allowed.
      - S3 Lifecycle rule: transitions or expires objects; it never transforms content.
      > 🇻🇳 Biến đổi dữ liệu khi GET mà không sửa object gốc → Lambda (function URL / API Gateway) đọc S3 rồi trả bản đã che.

  # ── Stale distractor replaced (closed / shut-down service) + explanation ──
  - id: "02-v1-12"
    base: "cc3052486a"
    options: { C: "S3 Requester Pays" }
    explanation: |
      S3 Transfer Acceleration routes uploads through the nearest CloudFront edge location and then over the AWS backbone to the bucket, which speeds up long-distance transfers of large files into a single bucket.
      - Byte-range fetches: parallelize downloads (GET), not uploads.
      - S3 Requester Pays: changes who pays for requests and data transfer, not speed.
      - S3 Cross-Region Replication: copies objects after the upload; it does not make the upload faster.
      > 🇻🇳 Người dùng toàn cầu upload chậm vào một bucket → S3 Transfer Acceleration (edge + backbone AWS).
  - id: "02-v2-15"
    base: "7ca0833f1a"
    options: { A: "S3 Requester Pays" }
    explanation: |
      S3 Transfer Acceleration sends uploads to the nearest CloudFront edge location and then across the AWS backbone to the bucket, which helps most when global users upload large files to one bucket.
      - S3 Requester Pays: changes who pays for requests and data transfer, not speed.
      - Byte-range fetches: parallelize downloads, not uploads.
      - S3 Inventory: lists objects and metadata on a schedule.
      > 🇻🇳 Upload toàn cầu chậm vào một bucket → S3 Transfer Acceleration.
  - id: "15-v1-08"
    base: "7e3d66a558"
    options: { A: "S3 Intelligent-Tiering" }
    explanation: |
      S3 Versioning keeps every version of an object, so an overwritten or deleted object can be restored from a previous version; MFA Delete additionally requires MFA to permanently delete versions or change the versioning state.
      - S3 Intelligent-Tiering: moves objects between access tiers to save cost; no protection from deletion.
      - Requester Pays: shifts request and transfer charges to the requester.
      - S3 Transfer Acceleration: speeds up long-distance uploads.
      > 🇻🇳 Chống xoá nhầm, khôi phục phiên bản cũ → S3 Versioning (+ MFA Delete).
