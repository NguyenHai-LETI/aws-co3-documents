  - id: "02-v1-13"
    base: "837c70d460"
    reason: "S3 Select is closed to new customers since 2024-07-25; AWS recommends Amazon Athena for SQL over S3 data — https://aws.amazon.com/blogs/storage/how-to-optimize-querying-your-data-in-amazon-s3/"
    stem: |
      Which service retrieves only specific rows/columns from large CSV/Parquet objects in S3 using SQL, reducing data scanned?
    options: { D: "Amazon Athena" }
    set: { services: [Athena, S3] }
    explanation: |
      Amazon Athena runs standard SQL directly on objects in S3; with columnar formats such as Parquet (plus partitioning) it reads only the needed columns and partitions, so less data is scanned and billed. AWS recommends Athena for querying data in S3: https://aws.amazon.com/blogs/storage/how-to-optimize-querying-your-data-in-amazon-s3/
      - S3 Storage Lens: organization-wide storage usage and activity metrics, no SQL over object contents.
      - S3 Inventory: scheduled lists of objects and their metadata, not their contents.
      - S3 Batch Operations: runs one action (copy, tag, invoke Lambda) across many objects; it does not query data.
      > 🇻🇳 SQL trực tiếp trên dữ liệu S3, chỉ đọc cột/hàng cần → Amazon Athena (Parquet + partition giảm dữ liệu quét).
  - id: "02-v2-17"
    base: "5a6e8938ca"
    reason: "S3 Select is closed to new customers since 2024-07-25; AWS recommends Amazon Athena for SQL over S3 data — https://aws.amazon.com/blogs/storage/how-to-optimize-querying-your-data-in-amazon-s3/"
    stem: |
      A team needs to run SQL queries to retrieve only a subset of rows from large CSV objects in Amazon S3 without downloading whole files. Which service?
    options: { C: "Amazon Athena" }
    set: { services: [Athena, S3] }
    explanation: |
      Amazon Athena runs SQL directly against the objects in S3 and returns only the matching rows, so nobody has to download whole files; it is serverless and bills per data scanned. AWS recommends Athena for querying data in S3: https://aws.amazon.com/blogs/storage/how-to-optimize-querying-your-data-in-amazon-s3/
      - S3 Transfer Acceleration: speeds up long-distance uploads; it does not query data.
      - S3 Inventory: lists objects and metadata, not rows inside them.
      - S3 Batch Operations: applies one action to many objects; no SQL filtering.
      > 🇻🇳 Lọc một phần dữ liệu CSV trên S3 bằng SQL, không tải cả file → Amazon Athena.
  - id: "03-v1-16"
    base: "2dce5582c2"
    reason: "Timestream for LiveAnalytics closed to new customers 2025-06-20 (use Timestream for InfluxDB); QLDB end of support 2025-07-31 — https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html · https://docs.aws.amazon.com/general/latest/gr/full_shutdown_services.html"
    options: { C: "Amazon Timestream for InfluxDB", D: "Amazon DocumentDB" }
    explanation: |
      Timestream for InfluxDB is a managed time-series database: it stores time-stamped sensor metrics efficiently and supports time-window queries and aggregations at scale. The original Timestream for LiveAnalytics accepts no new customers since 2025-06-20, so new time-series workloads use Timestream for InfluxDB.
      - Amazon RDS: general relational engine, not optimized for high-volume time-series ingest and retention.
      - Amazon Neptune: graph database for relationships, not metrics over time.
      - Amazon DocumentDB: JSON document store without native time-series functions.
      > 🇻🇳 Dữ liệu time-series (IoT metrics) → Amazon Timestream for InfluxDB (bản LiveAnalytics không nhận khách mới từ 2025-06-20).
