      - Amazon Data Firehose (formerly Kinesis Data Firehose): delivers data to destinations; no multiple custom consumers or replay.
      > 🇻🇳 Ingest real-time, nhiều ứng dụng cùng xử lý một bản ghi → Kinesis Data Streams.
